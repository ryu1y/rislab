
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹿児島交通バスロケ</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="title-area">
      <h1>🚌 鹿児島交通位置情報システム</h1>
      <div class="subtitle">リアルタイム運行位置表示</div>
    </div>

    <div class="toolbar">
      <input
        id="searchInput"
        type="search"
        placeholder="車両番号・【路線番号】で検索"
        autocomplete="off"
      >
      <button id="searchButton">検索</button>
      <button id="clearButton" class="secondary">全車両</button>
      <button id="refreshButton" class="secondary">更新</button>
    </div>
  </header>

  <section class="status-bar">
    <span id="connectionStatus">接続準備中...</span>
    <span>表示車両：<strong id="busCount">0</strong> 台</span>
    <span>路線数：<strong id="routeCount">--</strong></span>
    <span>最終更新：<strong id="lastUpdated">--</strong></span>
  </section>

  <div id="message" role="status"></div>

  <main>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
