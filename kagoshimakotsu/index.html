<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="鹿児島交通バスロケーション">
  <title>鹿児島交通 バスロケーション</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>鹿児島交通 バスロケーション</h1>
      <p>鹿児島交通西・指宿地区対応版</p>
    </div>
    <button id="refreshButton" type="button">管理用</button>
  </header>
  <main>
    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="ナンバー・路線名・車両IDで検索" aria-label="車両検索">
      <button id="searchButton" type="button">検索</button>
      <button id="clearButton" type="button" class="secondary">クリア</button>
    </section>
    <section class="statusbar">
      <span id="connectionStatus">起動中...</span>
      <span>表示車両：<strong id="busCount">0</strong></span>
      <span>確認路線：<strong id="routeCount">0</strong></span>
      <span>最終更新：<strong id="lastUpdated">--:--:--</strong></span>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="map" aria-label="バス位置地図"></div>
    <section class="legend">
      <span><i class="line future"></i>これから通るルート（経路データ登録時）</span>
      <span><i class="line past"></i>通ってきたルート（このブラウザで記録）</span>
    </section>
    <p class="note">注意：</p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
