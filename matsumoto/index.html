<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>アルピコ交通松本 バスロケシステム</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="title">
        🚌 アルピコ交通松本 バスロケシステム
    </div>

    <div id="updateTime">
        更新中...
    </div>

    <button id="gpsButton">
        📍現在地
    </button>
</header>

<div id="container">

    <!-- 左メニュー -->
    <aside id="sidebar">

        <!-- 車両検索 -->
        <div class="searchBox">

            <input
                type="text"
                id="search"
                placeholder="車番検索">

        </div>

        <!-- 車両一覧 -->
        <h2>🚌 車両一覧</h2>

        <div id="busList">

            読み込み中...

        </div>

        <!-- 路線一覧 -->
        <h2>🛣 路線一覧</h2>

        <div id="routeList">

            読み込み中...

        </div>

        <hr>

        

    </aside>

    <!-- 地図 -->
    <main>

        <div id="map"></div>

    </main>

</div>

<footer>

    OpenStreetMap © Contributors

</footer>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- 路線情報 -->
<script src="routeInfo.js"></script>

<!-- メイン -->
<script src="app.js"></script>

</body>

</html>
